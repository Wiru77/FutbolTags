<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header Example</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
      <div class="container">
        <!-- Brand Logo -->
        <a
          class="navbar-brand fw-bold"
          [routerLink]="['/']"
          routerLinkACtive="active"
          >fut<span class="text-primary">TAGS</span></a
        >

        <!-- Toggle button for mobile view -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a
                class="nav-link active"
                [routerLink]="['/panel/tags']"
                routerLinkACtive="active"
                >Tags</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                [routerLink]="['/panel/equipos']"
                routerLinkACtive="active"
                >Equipos</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                [routerLink]="['/panel/jugadores']"
                routerLinkACtive="active"
                >Jugadores</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                [routerLink]="['/panel/stats']"
                routerLinkACtive="active"
                >Estadísticas</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="megamenuDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                Megamenu
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Mega 1</a></li>
                <li><a class="dropdown-item" href="#">Mega 2</a></li>
              </ul>
            </li>
          </ul>

          <!-- Search and Icons -->
          <form class="d-flex align-items-center">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search for products..."
              aria-label="Search"
            />
            <button class="btn btn-outline-secondary" type="submit">
              <i class="bi bi-search"></i>
            </button>
          </form>
          <!-- Sección de usuario en la barra de navegación -->
          <div class="d-flex align-items-center ms-3">
            <ng-container *ngIf="user_lc == undefined">
              <a [routerLink]="['/login']" class="text-dark me-3">
                <i class="bi bi-person"></i> <span>Iniciar sesión</span>
              </a>
            </ng-container>

            <ng-container *ngIf="user_lc">
              <!-- Contenedor dropdown -->
              <div class="dropdown">
                <a
                  class="nav-tool dropdown-toggle"
                  id="userDropdown"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  style="cursor: pointer"
                >
                  <i class="bi bi-person"></i>
                  <span>{{ user_lc.nombres }}</span>
                </a>

                <!-- Menú desplegable -->
                <ul class="dropdown-menu" aria-labelledby="userDropdown">
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="ci-home me-2"></i>
                      Regular link
                      <span class="badge rounded-pill bg-secondary ms-2"
                        >2</span
                      >
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="ci-profile me-2"></i>
                      Profile
                      <span class="badge rounded-pill bg-danger ms-2">3</span>
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="ci-comment me-2"></i>
                      Messages
                      <span class="badge rounded-pill bg-success ms-2">5</span>
                    </a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">
                      <i class="ci-external-link me-2"></i>
                      Settings
                      <span class="badge rounded-pill bg-warning ms-2">1</span>
                    </a>
                  </li>
                  <li><hr class="dropdown-divider" /></li>
                  <li>
                    <a
                      class="dropdown-item text-danger"
                      style="cursor: pointer"
                      (click)="logout()"
                    >
                      <i class="bi bi-box-arrow-right me-2"></i>
                      Cerrar sesión
                    </a>
                  </li>
                </ul>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </nav>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Equipos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-nav></app-nav>

    <div class="container mt-4">
      <div class="header mb-4">
        <h1>Equipos</h1>
        <p>Este módulo lista todos los equipos.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Registro de equipo</h5>
        </div>
        <div class="card-body">
          <form #registroForm="ngForm" (ngSubmit)="registro(registroForm)">
            <div class="row g-3">
              <!-- Campo Nombre -->
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  placeholder="Nombre del Equipo"
                  required
                  name="nombre"
                  [(ngModel)]="equipo.nombre"
                />
              </div>

              <!-- Campo de cargar imagen-->
              <div class="row mt-4">
                <div class="col-md-6 text-center">
                  <label for="imagen" class="form-label">Portada</label>
                  <div class="mb-3">
                    <img
                      id="preview"
                      [src]="imgSelect"
                      alt="Imagen del jugador"
                      class="rounded img-thumbnail"
                      style="width: 150px; height: 150px; object-fit: cover"
                    />
                  </div>
                  <div class="d-flex justify-content-center">
                    <input
                      type="file"
                      id="imagen"
                      class="form-control"
                      accept="image/*"
                      (change)="fileChangeEvent($event)"
                    />
                  </div>
                </div>
              </div>

              <!-- Botones de acción -->
              <div class="mt-4 d-flex justify-content-between">
                <button class="btn btn-primary" type="submit">
                  Crear equipo
                </button>
                <a [routerLink]="['/panel/equipos']" class="btn btn-warning"
                  >Regresar</a
                >
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Actualizar Jugadores</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-nav></app-nav>
    <div class="container mt-4">
      <div class="header mb-4">
        <h1>Jugadores</h1>
        <p>En este módulo puedes editar al jugador</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Actualizar jugador</h5>
        </div>
        <div class="card-body">
          <form #updateForm="ngForm" (ngSubmit)="actualizar(updateForm)">
            <div class="row g-3">
              <!-- Campo Nombre -->
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  placeholder="Nombre del Jugador"
                  required
                  name="nombre"
                  [(ngModel)]="jugador.nombre"
                />
              </div>

              <!-- Campo Número -->
              <div class="col-md-6">
                <label for="numero" class="form-label">Número</label>
                <input
                  type="text"
                  class="form-control"
                  id="numero"
                  placeholder="Número del jugador"
                  required
                  name="numero"
                  [(ngModel)]="jugador.numero"
                />
              </div>

              <!-- Campo Posición -->
              <div class="col-md-6">
                <label for="posicion" class="form-label">Posición</label>
                <input
                  type="text"
                  class="form-control"
                  id="posicion"
                  placeholder="Posición del jugador"
                  required
                  name="posicion"
                  [(ngModel)]="jugador.posicion"
                />
              </div>

              <!-- Campo Fecha de Nacimiento-->
              <div class="col-md-6">
                <label for="fecha_nacimiento" class="form-label"
                  >Fecha de Nacimiento</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="fecha_nacimiento"
                  required
                  name="fecha_nacimiento"
                  [(ngModel)]="jugador.fecha_nacimiento"
                  (ngModelChange)="calcularEdad()"
                />
              </div>

              <!-- Campo Edad -->
              <div class="col-md-6">
                <label for="edad" class="form-label">Edad</label>
                <input
                  type="text"
                  class="form-control"
                  id="edad"
                  [value]="jugador.edad"
                  readonly
                />
              </div>

              <!-- Campo Equipo -->
              <div class="col-md-6">
                <label for="equipo" class="form-label">Equipo</label>
                <select
                  class="form-select"
                  id="equipo"
                  name="equipo_id"
                  [(ngModel)]="jugador.equipo_id"
                >
                  <option [ngValue]="null">Sin equipo</option>
                  <option *ngFor="let equipo of equipos" [ngValue]="equipo._id">
                    {{ equipo.nombre }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Campo de cargar imagen (fuera de row.g-3) -->
            <div class="row mt-4">
              <div class="col-md-6 text-center">
                <label for="imagen" class="form-label">Portada</label>
                <div class="mb-3">
                  <img
                    id="preview"
                    [src]="imgSelect"
                    alt="Imagen del jugador"
                    class="rounded img-thumbnail"
                    style="width: 150px; height: 150px; object-fit: cover"
                  />
                </div>
                <div class="d-flex justify-content-center">
                  <input
                    type="file"
                    id="imagen"
                    class="form-control"
                    accept="image/*"
                    (change)="fileChangeEvent($event)"
                  />
                </div>
              </div>
            </div>

            <!-- Botones de acción -->
            <div class="mt-4 d-flex justify-content-between">
              <button *ngIf="!load_btn" class="btn btn-primary" type="submit">
                Actualizar jugador
              </button>
              <a [routerLink]="['/panel/jugadores']" class="btn btn-warning">
                Regresar
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

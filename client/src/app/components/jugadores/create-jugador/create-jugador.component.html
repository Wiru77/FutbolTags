<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Jugadores</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-nav></app-nav>
    <div class="container mt-4">
      <div class="header mb-4">
        <h1>Jugadores</h1>
        <p>Este módulo lista todos los jugadores.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Registro de jugador</h5>
        </div>
        <div class="card-body">
          <form #registroForm="ngForm" (ngSubmit)="registro(registroForm)">
            <div class="row g-3">
              <!-- Campo Nombre -->
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  placeholder="Nombre del Jugador"
                  required
                  name="nombre"
                  [(ngModel)]="jugador.nombre"
                  #nombre="ngModel"
                  [ngClass]="{ 'is-invalid': nombre.invalid && nombre.touched }"
                />
              </div>

              <!-- Campo Alias -->
              <div class="col-md-6">
                <label for="alias" class="form-label">Alias</label>
                <input
                  type="text"
                  class="form-control"
                  id="alias"
                  placeholder="Alias del Jugador"
                  required
                  name="alias"
                  [(ngModel)]="jugador.alias"
                  #alias="ngModel"
                  [ngClass]="{ 'is-invalid': alias.invalid && alias.touched }"
                />
              </div>

              <!-- Campo Numero -->
              <div class="col-md-6">
                <label for="numero" class="form-label">Número de dorsal</label>
                <input
                  type="text"
                  class="form-control"
                  id="numero"
                  placeholder="Número del jugador"
                  required
                  name="numero"
                  [(ngModel)]="jugador.numero"
                  #numero="ngModel"
                  [ngClass]="{ 'is-invalid': numero.invalid && numero.touched }"
                />
              </div>

              <!-- Campo Posición -->
              <div class="col-md-6">
                <label for="posicion" class="form-label">Posición</label>
                <input
                  type="text"
                  class="form-control"
                  id="posicion"
                  placeholder="Posición del jugador"
                  required
                  name="posicion"
                  [(ngModel)]="jugador.posicion"
                  #posicion="ngModel"
                  [ngClass]="{
                    'is-invalid': posicion.invalid && posicion.touched
                  }"
                />
              </div>

              <!-- Campo Fecha de Nacimiento-->
              <div class="col-md-6">
                <label for="fecha_nacimiento" class="form-label"
                  >Fecha de Nacimiento</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="fecha_nacimiento"
                  required
                  name="fecha_nacimiento"
                  [(ngModel)]="jugador.fecha_nacimiento"
                  (ngModelChange)="calcularEdad()"
                  #fecha_nacimiento="ngModel"
                  [ngClass]="{
                    'is-invalid':
                      fecha_nacimiento.invalid && fecha_nacimiento.touched
                  }"
                />
              </div>

              <!-- Campo Edad (solo lectura, sin validación) -->
              <div class="col-md-6">
                <label for="edad" class="form-label">Edad</label>
                <input
                  type="text"
                  class="form-control"
                  id="edad"
                  [value]="jugador.edad"
                  readonly
                />
              </div>

              <!-- Campo Lugar de Procedencia -->
              <div class="col-md-6">
                <label for="lugar_procedencia" class="form-label"
                  >Lugar de Procedencia</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="lugar_procedencia"
                  placeholder="Lugar de Procedencia"
                  required
                  name="lugar_procedencia"
                  [(ngModel)]="jugador.lugar_procedencia"
                  #lugar_procedencia="ngModel"
                  [ngClass]="{
                    'is-invalid':
                      lugar_procedencia.invalid && lugar_procedencia.touched
                  }"
                />
              </div>

              <!-- Campo Estatura -->
              <div class="col-md-6">
                <label for="estatura" class="form-label">Estatura en cm</label>
                <input
                  type="text"
                  class="form-control"
                  id="estatura"
                  placeholder="Estatura del jugador"
                  required
                  name="estatura"
                  [(ngModel)]="jugador.estatura"
                  #estatura="ngModel"
                  [ngClass]="{
                    'is-invalid': estatura.invalid && estatura.touched
                  }"
                />
              </div>

              <!-- Campo Peso -->
              <div class="col-md-6">
                <label for="peso" class="form-label">Peso en kg</label>
                <input
                  type="text"
                  class="form-control"
                  id="peso"
                  placeholder="Peso del jugador"
                  required
                  name="peso"
                  [(ngModel)]="jugador.peso"
                  #peso="ngModel"
                  [ngClass]="{ 'is-invalid': peso.invalid && peso.touched }"
                />
              </div>

              <!-- Campo Pierna Habil -->
              <div class="col-md-6">
                <label for="pierna_habil" class="form-label"
                  >Pierna hábil</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="pierna_habil"
                  placeholder="Pierna hábil"
                  required
                  name="pierna_habil"
                  [(ngModel)]="jugador.pierna_habil"
                  #pierna_habil="ngModel"
                  [ngClass]="{
                    'is-invalid': pierna_habil.invalid && pierna_habil.touched
                  }"
                />
              </div>

              <!-- Campo Equipo de Procedencia -->
              <div class="col-md-6">
                <label for="equipo_procedencia" class="form-label"
                  >Equipo de Procedencia</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="equipo_procedencia"
                  placeholder="Equipo de procedencia"
                  required
                  name="equipo_procedencia"
                  [(ngModel)]="jugador.equipo_procedencia"
                  #equipo_procedencia="ngModel"
                  [ngClass]="{
                    'is-invalid':
                      equipo_procedencia.invalid && equipo_procedencia.touched
                  }"
                />
              </div>

              <!-- Campo Equipo -->
              <div class="col-md-6">
                <label for="equipo" class="form-label">Equipo</label>
                <select
                  class="form-select"
                  id="equipo"
                  name="equipo_id"
                  [(ngModel)]="jugador.equipo_id"
                  required
                  #equipo_id="ngModel"
                  [ngClass]="{
                    'is-invalid': equipo_id.invalid && equipo_id.touched
                  }"
                >
                  <option [ngValue]="null">Sin equipo</option>
                  <option *ngFor="let equipo of equipos" [ngValue]="equipo._id">
                    {{ equipo.nombre }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Campo de cargar imagen-->
            <div class="row mt-4">
              <div class="col-md-6 text-center">
                <label for="imagen" class="form-label">Portada</label>
                <div class="mb-3">
                  <img
                    id="preview"
                    [src]="imgSelect"
                    alt="Imagen del jugador"
                    class="rounded img-thumbnail"
                    style="width: 150px; height: 150px; object-fit: cover"
                  />
                </div>
                <div class="d-flex justify-content-center">
                  <input
                    type="file"
                    id="imagen"
                    class="form-control"
                    accept="image/*"
                    (change)="fileChangeEvent($event)"
                  />
                </div>
              </div>
            </div>
            <!-- Botones de acción -->
            <div class="mt-4 d-flex justify-content-between">
              <button class="btn btn-primary" type="submit">
                Crear jugador
              </button>
              <a [routerLink]="['/panel/jugadores']" class="btn btn-warning"
                >Regresar</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

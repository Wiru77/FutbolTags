<app-nav></app-nav>
<div class="container py-5">
  <div class="row">
    <!-- Login Form -->
    <div class="col-md-6">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Correo electrónico</label>
          <input
            type="email"
            class="form-control"
            id="loginEmail"
            placeholder="Correo electrónico"
            required=""
            name="email"
            [(ngModel)]="user.email"
          />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Contraseña</label>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="loginPassword"
              placeholder="Tu contraseña"
              required=""
              name="password"
              [(ngModel)]="user.password"
            />
            <button class="btn btn-outline-secondary" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <a href="#" class="text-decoration-none">Olvidó su contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Iniciar sesión
        </button>
        <div class="mt-3 text-center">
          <span
            >No tienes una cuenta?
            <a href="#" class="text-decoration-none">Regístrate</a></span
          >
        </div>
      </form>
    </div>

    <!-- Registration Form -->
    <div class="col-md-6">
      <h3 class="text-center mb-4">Registro rápido</h3>
      <form>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="firstName" class="form-label">Nombres completos</label>
            <input
              type="text"
              class="form-control"
              id="firstName"
              placeholder="Names"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label for="lastName" class="form-label">Apellidos completos</label>
            <input
              type="text"
              class="form-control"
              id="lastName"
              placeholder="Fullname"
            />
          </div>
        </div>
        <div class="mb-3">
          <label for="registerEmail" class="form-label"
            >Correo electrónico</label
          >
          <input
            type="email"
            class="form-control"
            id="registerEmail"
            placeholder="correo electrónico"
            required=""
            name="email"
            [(ngModel)]="user.email"
          />
        </div>
        <div class="mb-3">
          <label for="registerPassword" class="form-label">Contraseña</label>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="registerPassword"
              placeholder="Contraseña"
              name="password"
              [(ngModel)]="user.password"
            />
            <button class="btn btn-outline-secondary" type="button">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        <div class="mt-3 text-center">
          <span
            >Ya tienes una cuenta?
            <a href="#" class="text-decoration-none">Registrarme</a></span
          >
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Icons -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
  rel="stylesheet"
/>
<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Actualizar Tags</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-nav></app-nav>
    <div class="container mt-4">
      <div class="header mb-4">
        <h1>Edita tu tag</h1>
        <p>En este módulo puedes editar el tag</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Actualizar tag</h5>
        </div>
        <div class="card-body">
          <!-- Formulario -->
          <form #updateForm="ngForm" (ngSubmit)="actualizar(updateForm)">
            <div class="row g-3">
              <!-- Campo Nombre -->
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  placeholder="Nombre del Tag"
                  required
                  name="nombre"
                  [(ngModel)]="tag.nombre"
                />
              </div>

              <!-- Abreviatura -->
              <div class="col-md-6">
                <label for="abreviatura" class="form-label">Abreviatura</label>
                <input
                  type="text"
                  class="form-control"
                  id="abreviatura"
                  placeholder="Abreviatura"
                  required
                  name="abreviatura"
                  [(ngModel)]="tag.abreviatura"
                />
              </div>

              <!-- Campo Tipo -->
              <div class="col-md-6">
                <label for="tipo" class="form-label">Tipo</label>
                <select
                  class="form-control"
                  id="tipo"
                  value="tipo"
                  name="tipo"
                  [(ngModel)]="tag.tipo"
                >
                  <option *ngFor="let tipo of tipos" [ngValue]="tipo">
                    {{ tipo }}
                  </option>
                </select>
              </div>

              <div></div>

              <!-- Efectividad -->
              <div class="col-md-6">
                <label for="efectividad" class="form-label">Efectividad</label>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="efectividad"
                    name="efectividad"
                    [(ngModel)]="tag.efectividad"
                  />
                  <label class="form-check-label" for="efectividad">
                    {{ tag.efectividad ? "Sí" : "No" }}
                  </label>
                </div>
              </div>

              <!-- Balón Parado (Checkbox) -->
              <div class="col-md-6">
                <label for="balon_parado" class="form-label"
                  >Balón Parado</label
                >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="balon_parado"
                    name="balon_parado"
                    [(ngModel)]="tag.balon_parado"
                  />
                  <label class="form-check-label" for="balon_parado">
                    {{ tag.balon_parado ? "Sí" : "No" }}
                  </label>
                </div>
              </div>

              <!-- Tendencia (Checkbox) -->
              <div class="col-md-6">
                <label for="tendencia" class="form-label">Tendencia</label>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="tendencia"
                    name="tendencia"
                    [(ngModel)]="tag.tendencia"
                  />
                  <label class="form-check-label" for="tendencia">
                    {{ tag.tendencia ? "Sí" : "No" }}
                  </label>
                </div>
              </div>

              <!-- Asociación (Checkbox) -->
              <div class="col-md-6">
                <label for="asociacion" class="form-label">Asociación</label>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="asociacion"
                    name="asociacion"
                    [(ngModel)]="tag.asociacion"
                  />
                  <label class="form-check-label" for="asociacion">
                    {{ tag.asociacion ? "Sí" : "No" }}
                  </label>
                </div>
              </div>

              <!-- Porteria (Checkbox) -->
              <div class="col-md-6">
                <label for="porteria" class="form-label">Porteria</label>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="porteria"
                    name="porteria"
                    [(ngModel)]="tag.porteria"
                  />
                  <label class="form-check-label" for="porteria">
                    {{ tag.tendencia ? "Sí" : "No" }}
                  </label>
                </div>
              </div>
            </div>
            <!-- Cierre correcto del row g-3 -->

            <!-- Botones de acción -->
            <div class="mt-4 d-flex justify-content-between">
              <button *ngIf="!load_btn" class="btn btn-primary" type="submit">
                Actualizar tag
              </button>
              <a [routerLink]="['/panel/tags/lista']" class="btn btn-warning"
                >Regresar</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>

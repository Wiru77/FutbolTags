<app-nav></app-nav>
<head>
  <meta charset="UTF-8" />
  <title>Equipos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>
<body>
  <div class="header">
    <button class="btn-back" [routerLink]="['/panel/gestion']">← Volver</button>
    <h1>Casa club</h1>
  </div>
  <div class="container">
    <div
      *ngFor="let equipo of equipos"
      class="card-button"
      (click)="irADetalleEquipo(equipo._id)"
    >
      <i class="fas fa-folder"></i>
      {{ equipo.nombre }}
    </div>
  </div>
</body>
